<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Foundry · Perrin Research</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/foundry.css" />
</head>
<body>
  <div id="login-view">
    <div class="login-card">
      <p class="overline">Internal · Foundry</p>
      <h1>Perrin<span class="brand-sep">//</span>Research</h1>
      <p>Project pipeline, kanban tasks, and agent prompt queue.</p>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required />
        <label for="password">Password</label>
        <div class="password-field">
          <input id="password" type="password" autocomplete="current-password" required />
          <button type="button" class="password-toggle" aria-label="Show password">
            <svg class="eye-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M10 4C5 4 1.73 7.11 1 10c.73 2.89 4 6 9 6s8.27-3.11 9-6c-.73-2.89-4-6-9-6zm0 10a4 4 0 110-8 4 4 0 010 8zm0-6.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5z" fill="currentColor"/>
            </svg>
          </button>
        </div>
        <button type="submit" class="btn">Sign in</button>
        <p id="login-error" class="error hidden"></p>
      </form>
    </div>
  </div>

  <div id="app-view" class="hidden">
    <header class="header">
      <div class="header-inner">
        <a href="#" class="brand" id="home-link">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Perrin<span class="brand-sep">//</span>Research</span>
          <span class="brand-tag mono">Foundry</span>
        </a>
        <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="foundry-nav" aria-label="Toggle navigation">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>
        <div id="foundry-nav" class="header-nav">
          <nav class="nav-tabs" aria-label="Main navigation">
            <button type="button" data-view="projects" class="active">Projects</button>
            <button type="button" data-view="agents">Agent queue</button>
          </nav>
          <div class="user-menu" id="user-menu">
            <button
              type="button"
              class="user-menu-toggle"
              id="user-menu-toggle"
              aria-expanded="false"
              aria-haspopup="true"
              aria-controls="user-menu-dropdown"
              aria-label="Account menu"
            >
              <svg class="user-menu-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.75"/>
                <path d="M5 19.5c1.6-3.2 4-4.8 7-4.8s5.4 1.6 7 4.8" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
              </svg>
            </button>
            <div class="user-menu-dropdown hidden" id="user-menu-dropdown" role="menu">
              <button type="button" class="user-menu-item hidden" id="menu-users" role="menuitem">Users</button>
              <button type="button" class="user-menu-item" id="menu-change-password" role="menuitem">Change password</button>
              <button type="button" class="user-menu-item" id="menu-sign-out" role="menuitem">Sign out</button>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main class="main" id="main"></main>
    <footer class="site-footer">
      <p class="footer-name">Perrin Research LLC</p>
      <p class="footer-tagline mono">idea → prototype → evidence → product</p>
    </footer>
  </div>

  <script src="/assets/app.js" type="module"></script>
  <script src="/assets/eval-config.js"></script>
  <script src="/assets/eval-loader.js"></script>
</body>
</html>
